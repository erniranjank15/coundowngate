<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flip Digital Countdown</title>
  <style>
    body {
      /*background: #111;*/
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      font-family: "Courier New", monospace;
      color: #fff;
      overflow:hidden;
    }


    h1{
        font-size: 7rem;
        font-weight: bold;
        color: rgb(210, 30, 81);
        font-family:Arial, Helvetica, sans-serif;
        text-transform: uppercase;
    }

    .countdown {
      display: flex;
      gap: 30px;
    }
    .flip-card {
      perspective: 1000px;
      text-align: center;
    }
    .flip-inner {
      position: relative;
      width: 180px;
      height: 160px;
      background: #222;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      font-size: 7rem;
      font-weight: bold;
      line-height: 120px;
      color: #00ff99;
      transition: transform 0.8s;
      transform-style: preserve-3d;
      
    }
    .flip-card.flipping .flip-inner {
      transform: rotateX(-180deg);
    }
    .label {
      margin-top: 20px;
      color: #0d0000;
      font-size: 2.0rem;
      text-transform: uppercase;
      font-weight: bolder;
      font-family: Arial, Helvetica, sans-serif;
    }


  @media(width<=768px) {
      .countdown {
        gap: 5px;
      }
      .flip-inner {
        width: 80px;
        height: 70px;
        font-size: 1.5rem;
        line-height: 70px;
      }
      .label {
        font-size: 1rem;
      }
}

  </style>
</head>
<body>
    <h1>Gate 2026</h1>
  <div class="countdown">
    <div class="flip-card" id="days-box">
      <div class="flip-inner" id="days">0</div>
      <div class="label">Days</div>
    </div>
    <div class="flip-card" id="hours-box">
      <div class="flip-inner" id="hours">00</div>
      <div class="label">Hours</div>
    </div>
    <div class="flip-card" id="minutes-box">
      <div class="flip-inner" id="minutes">00</div>
      <div class="label">Minutes</div>
    </div>
    <div class="flip-card" id="seconds-box">
      <div class="flip-inner" id="seconds">00</div>
      <div class="label">Seconds</div>
    </div>
  </div>

  <script>
    const targetDate = new Date("2025-12-31 23:59:59");

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.querySelector(".countdown").textContent = "Countdown finished!";
        clearInterval(timer);
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      flipNumber("days", days);
      flipNumber("hours", hours.toString().padStart(2, "0"));
      flipNumber("minutes", minutes.toString().padStart(2, "0"));
      flipNumber("seconds", seconds.toString().padStart(2, "0"));
    }

    function flipNumber(id, newNumber) {
      const box = document.getElementById(id);
      if (box.textContent !== newNumber.toString()) {
        const card = box.parentElement;
        card.classList.add("flipping");
        setTimeout(() => {
          box.textContent = newNumber;
          card.classList.remove("flipping");
        }, 300);
      }
    }

    const timer = setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
